[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swepro-functional-verifier"
version = "0.1.0"
description = "Functional verifier conversion workflow for SWE-bench Pro V2 Harbor tasks"
requires-python = ">=3.12"
dependencies = [
  "mini-swe-agent==2.4.6",
  "PyYAML==6.0.3",
  "requests==2.34.2",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
swepro-trans = "swepro_trans.cli:main"
swepro-convert-agent = "swepro_trans.agents.runner:main"
swepro-runtime-check = "swepro_trans.agents.runtime_check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
